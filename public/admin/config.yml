          - { label: "Italic words in heading", name: headingItalic, widget: string }
          - { label: "Star rating", name: rating, widget: string, hint: "e.g. 5.0" }
          - { label: "Number of Google reviews", name: count, widget: number, value_type: int, min: 0 }
          - { label: "Link to Google reviews", name: reviewsUrl, widget: string }

      - name: connect
        label: "Closing call-to-action"
